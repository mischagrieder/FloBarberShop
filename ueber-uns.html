<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Über uns – FLO Barber Shop Oftringen</title>
  <meta name="description" content="Über FLO Barber Shop in Oftringen – Handwerk, Fades und Bart-Styling mit Liebe zum Detail." />
  <meta name="theme-color" content="#0c0c0d" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header scrolled" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="logo" data-logo>FLO<span>Barber</span></a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a href="index.html#leistungen">Leistungen</a>
        <a href="index.html#galerie">Ergebnisse</a>
        <a href="index.html#kontakt">Standort</a>
        <a href="index.html#bewertungen">Rezensionen</a>
        <a href="ueber-uns.html" aria-current="page">Über uns</a>
      </nav>
      <a href="index.html#kontakt" class="btn btn-gold btn-sm nav-cta">Termin</a>
      <button class="nav-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="section subpage">
      <div class="container about-grid">
        <div class="about-media">
          <div class="about-img" data-about-img></div>
        </div>
        <div class="about-text">
          <p class="eyebrow">Über uns</p>
          <h1 data-bind="aboutTitle">Handwerk, das man sieht</h1>
          <p data-bind="aboutText"></p>
          <ul class="checks" data-about-points></ul>
          <div class="hero-actions">
            <a href="index.html#kontakt" class="btn btn-gold">Termin anfragen</a>
            <a href="index.html" class="btn btn-ghost">← Zur Startseite</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo" data-logo>FLO<span>Barber</span></span>
        <p data-bind="footerAddress"></p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="index.html#leistungen">Leistungen</a>
        <a href="index.html#galerie">Ergebnisse</a>
        <a href="index.html#kontakt">Standort</a>
        <a href="index.html#bewertungen">Rezensionen</a>
        <a href="#" data-instagram target="_blank" rel="noopener">Instagram</a>
      </nav>
      <p class="footer-copy" data-copy></p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <!-- Titel dieser Unterseite nach main.js wiederherstellen -->
  <script>document.title = "Über uns – " + (window.SHOP ? window.SHOP.brand + " " + window.SHOP.city : "FLO Barber Shop Oftringen");</script>
</body>
</html>
